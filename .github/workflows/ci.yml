name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Tes API PHP end-to-end terhadap MySQL sungguhan
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rt_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'      # versi minimum yang didukung
          extensions: pdo_mysql
          coverage: none          # tanpa xdebug/pcov (sumber warning JIT di log)
      - name: Lint PHP
        run: find server -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tes asap API
        env: { DB_HOST: 127.0.0.1, DB_NAME: rt_test, DB_USER: root, DB_PASS: root }
        run: bash server/tests/smoke.sh

  # Build APK rilis (diperkecil R8). Alamat API dari repo variable API_BASE.
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # untuk melampirkan APK ke GitHub Release saat tag v*
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Siapkan keystore (bila secret tersedia)
        env:
          KS: ${{ secrets.RT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/rt.jks"
            echo "RT_KEYSTORE_FILE=$RUNNER_TEMP/rt.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret RT_KEYSTORE_BASE64 belum diisi — APK ditandatangani kunci debug sementara (tidak bisa update menimpa versi sebelumnya)."
          fi
      - name: Build APK
        working-directory: android
        env:
          RT_KEYSTORE_PASSWORD: ${{ secrets.RT_KEYSTORE_PASSWORD }}
          RT_KEY_ALIAS: ${{ secrets.RT_KEY_ALIAS }}
          RT_KEY_PASSWORD: ${{ secrets.RT_KEY_PASSWORD }}
        run: |
          API="${{ vars.API_BASE }}"
          gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }} ${API:+-PapiBase=$API}
          cp app/build/outputs/apk/release/app-release.apk ../rukuntetangga.apk
          ls -lh ../rukuntetangga.apk
          # Sidik jari kunci tanda tangan (harus SAMA di setiap build agar update bisa menimpa)
          keytool -printcert -jarfile ../rukuntetangga.apk | grep -E "Owner|SHA256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: rukuntetangga-apk
          path: rukuntetangga.apk
      - name: Rilis (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rukuntetangga.apk
